<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <title>Maze Architect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #canvas { touch-action: none; cursor: crosshair; }
        option[value="aldous"] { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h1 class="brand">Maze Architect</h1>
            
            <div class="section hero">
                <div class="row" style="align-items: center;">
                    <div class="col">
                        <label for="inp-cols">Columns (X)</label>
                        <input type="number" id="inp-cols" value="20" min="2">
                    </div>
                    <button id="btn-lock-ratio" class="btn-icon" title="Lock Aspect Ratio">🔗</button>
                    <div class="col">
                        <label for="inp-rows">Rows (Y)</label>
                        <input type="number" id="inp-rows" value="20" min="2">
                    </div>
                </div>
                
                <button id="btn-generate" class="btn-primary">GENERATE MAZE</button>
                
                <div class="section" style="margin-top: 5px;">
                    <label for="inp-speed" style="display: flex; justify-content: space-between;">
                        <span>Generation Speed</span>
                        <span id="lbl-speed" style="color: var(--primary);">Fast</span>
                    </label>
                    <input type="range" id="inp-speed" min="1" max="100" value="90">
                </div>

                <div class="status-bar" id="status-text" style="margin-top: -5px;">Ready</div>
            </div>

            <hr class="divider">

            <!-- Core Config -->
            <div class="section">
                <label for="sel-algo" style="color: var(--primary); font-size: 1rem;">Algorithm</label>
                <select id="sel-algo" style="border-color: var(--primary);">
                    <option value="dfs" selected>Recursive Backtracker (River-like)</option>
                    <option value="huntkill">Hunt & Kill (Winding)</option>
                    <option value="prims">Randomized Prim's (Short branches)</option>
                    <option value="kruskal">Randomized Kruskal's (Puzzle-like)</option>
                    <option value="wilson">Wilson's (Loop-Erased)</option>
                    <option value="division" class="incompatible">Recursive Division (Blocky)</option>
                    <option value="eller" class="incompatible">Eller's (Infinite scroll)</option>
                    <option value="sidewinder" class="incompatible">Sidewinder (Wind-swept)</option>
                    <option value="binary" class="incompatible">Binary Tree (Diagonal bias)</option>
                    <option value="aldous">Aldous-Broder (random walk, slow)</option>
                </select>
            </div>

            <div class="section">
                <label for="inp-loops">Erase Walls (Create Loops)</label>
                <input type="range" id="inp-loops" min="0" max="50" value="0">
            </div>

            <hr class="divider">

            <!-- Maze Modes -->
            <div class="section">
                <label for="sel-mode" style="color: var(--primary); font-size: 1rem;">Solver Mode</label>
                <select id="sel-mode" style="border-color: var(--primary);">
                    <option value="none" selected>Standard (None)</option>
                    <option value="auto">Automatic Solve (🐒 & 🍌)</option>
                    <option value="draw">Draw Custom Path</option>
                </select>
            </div>

            <div id="ui-draw" class="section hidden">
                <p class="description" style="color:#aaa;">Click and drag backwards from the <strong>red arrowhead</strong> to adjust the path.</p>
                <p class="description warning" id="draw-warning" style="margin-top: 5px;">Algorithm locked to Kruskal's for custom paths.</p>
                <button id="btn-tool-clear" class="btn-tool" style="width: 100%; margin-top: 5px;">🗑️ Clear Sample Path</button>
            </div>

            <hr class="divider">

            <!-- Export -->
            <div class="section">
                <label style="color: var(--primary); font-size: 1rem;">Export Options</label>

                <div class="checkbox-row" style="margin: 5px 0;">
                    <input type="checkbox" id="chk-simplify" checked> 
                    <label for="chk-simplify" style="cursor:pointer;" title="Combines straight walls into single lines. Best for Plotters.">
                        Simplify SVG Paths
                    </label>
                </div>
                
                <div class="checkbox-row" style="margin-bottom: 5px;">
                    <input type="checkbox" id="chk-round" checked> 
                    <label for="chk-round" style="cursor:pointer;" title="Applies round corners to the solution line.">
                        Round Path Ends & Corners
                    </label>
                </div>
                
                <div class="btn-group" style="margin-top: 10px;">
                    <button id="btn-exp-svg" style="border: 1px solid var(--primary);">Download SVG</button>
                    <button id="btn-exp-png" style="border: 1px solid var(--primary);">Download PNG</button>
                </div>
            </div>

        </aside>

        <main class="viewport" id="viewport">
            <canvas id="canvas"></canvas>
            <div id="toast-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

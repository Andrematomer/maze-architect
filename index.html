<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <title>Maze Architect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Prevents mobile scrolling while drawing on the canvas */
        #canvas { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="brand">Maze Architect</h1>
            
            <!-- Hero Section -->
            <div class="section hero">
                <div class="row" style="align-items: center;">
                    <div class="col">
                        <label for="inp-cols">Columns (X)</label>
                        <input type="number" id="inp-cols" value="20" min="2" max="200">
                    </div>
                    <button id="btn-lock-ratio" class="btn-icon" title="Lock Aspect Ratio">🔗</button>
                    <div class="col">
                        <label for="inp-rows">Rows (Y)</label>
                        <input type="number" id="inp-rows" value="20" min="2" max="200">
                    </div>
                </div>
                
                <button id="btn-generate" class="btn-primary">GENERATE MAZE</button>
                
                <!-- Speed Slider moved here -->
                <div class="section" style="margin-top: 5px;">
                    <label for="inp-speed" style="display: flex; justify-content: space-between;">
                        <span>Generation Speed</span>
                        <span id="lbl-speed" style="color: var(--primary);">Fast</span>
                    </label>
                    <input type="range" id="inp-speed" min="1" max="100" value="98">
                </div>

                <div class="status-bar" id="status-text" style="margin-top: -5px;">Ready</div>
            </div>

            <!-- Advanced Section -->
            <details class="advanced-panel">
                <summary>Advanced Configuration</summary>
                
                <div class="section" style="margin-top: 10px;">
                    <label for="sel-algo">Algorithm</label>
                    <select id="sel-algo">
                        <option value="dfs" selected>Recursive Backtracker (River-like)</option>
                        <option value="huntkill">Hunt & Kill (Winding)</option>
                        <option value="prims">Randomized Prim's (Short branches)</option>
                        <option value="kruskal">Randomized Kruskal's (Puzzle-like)</option>
                        <option value="aldous">Aldous-Broder (Random Walk)</option>
                        <option value="wilson">Wilson's (Loop-Erased)</option>
                        <option value="division" class="incompatible">Recursive Division (Blocky)</option>
                        <option value="eller" class="incompatible">Eller's (Infinite scroll)</option>
                        <option value="sidewinder" class="incompatible">Sidewinder (Wind-swept)</option>
                        <option value="binary" class="incompatible">Binary Tree (Diagonal bias)</option>
                    </select>
                </div>

                <hr class="divider">

                <div class="section tool-box">
                    <label>Pre-Draw Custom Path</label>
                    <div class="btn-group">
                        <button id="btn-tool-pencil" class="btn-tool" title="Draw Path">✏️ Draw</button>
                        <button id="btn-tool-clear" class="btn-tool" title="Clear Path">🗑️ Clear</button>
                    </div>
                    <p class="description warning hidden" id="path-warning">
                        Drawing a path disables: Division, Eller's, Sidewinder, and Binary Tree.
                    </p>
                </div>

                <hr class="divider">

                <div class="section">
                    <label for="inp-loops">Erase Walls (Create Loops)</label>
                    <input type="range" id="inp-loops" min="0" max="50" value="0">
                    <p class="description">Erases: <span id="lbl-loops">0%</span> of internal walls.</p>
                </div>
            </details>

            <hr class="divider">

            <!-- Solver and Export Section (Moved Outside Details) -->
            <div class="section">
                <div class="checkbox-row" style="margin: 5px 0;">
                    <input type="checkbox" id="chk-solve"> 
                    <label for="chk-solve" style="cursor:pointer; color: var(--primary); font-size: 1rem;">
                        Solve Maze (Drag 🐒 & 🍌)
                    </label>
                </div>

                <div class="row" style="margin-top: 10px;">
                    <div class="col">
                        <label for="sel-join">Export Line Corners</label>
                        <select id="sel-join">
                            <option value="miter">Sharp (Miter)</option>
                            <option value="round" selected>Round</option>
                            <option value="bevel">Cut (Bevel)</option>
                        </select>
                    </div>
                </div>
                
                <div class="btn-group" style="margin-top: 10px;">
                    <button id="btn-exp-svg">Download SVG</button>
                    <button id="btn-exp-png">Download PNG</button>
                </div>
            </div>

        </aside>

        <main class="viewport" id="viewport">
            <canvas id="canvas"></canvas>
            <div id="toast-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

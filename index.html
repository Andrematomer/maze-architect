<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
    <title>Maze Architect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="brand">Maze Architect</h1>
            
            <!-- Hero Section -->
            <div class="section hero">
                <div class="row" style="align-items: center;">
                    <div class="col">
                        <label for="inp-cols">Columns (X)</label>
                        <input type="number" id="inp-cols" value="20" min="2" max="200">
                    </div>
                    <button id="btn-lock-ratio" class="btn-icon" title="Lock Aspect Ratio">🔗</button>
                    <div class="col">
                        <label for="inp-rows">Rows (Y)</label>
                        <input type="number" id="inp-rows" value="20" min="2" max="200">
                    </div>
                </div>
                <button id="btn-generate" class="btn-primary">GENERATE MAZE</button>
                <div class="status-bar" id="status-text">Ready</div>
            </div>

            <!-- Advanced Section -->
            <details class="advanced-panel">
                <summary>Advanced Configuration</summary>
                
                <div class="section">
                    <label for="sel-algo">Algorithm</label>
                    <select id="sel-algo">
                        <option value="dfs" selected>Recursive Backtracker (River-like)</option>
                        <option value="huntkill">Hunt & Kill (Winding, prevents stack overflow)</option>
                        <option value="prims">Randomized Prim's (Short branches, electric)</option>
                        <option value="kruskal">Randomized Kruskal's (Uniform, puzzle-like)</option>
                        <option value="aldous">Aldous-Broder (Random Walk, Slow)</option>
                        <option value="wilson">Wilson's (Uniform Loop-Erased, Slow)</option>
                        <option value="division">Recursive Division (Blocky rooms)</option>
                        <option value="eller">Eller's (Infinite scrolling logic)</option>
                        <option value="sidewinder">Sidewinder (Wind-swept look)</option>
                        <option value="binary">Binary Tree (Diagonal bias)</option>
                    </select>
                </div>

                <div class="section">
                    <label for="inp-speed">Generation Speed: <span id="lbl-speed">Fast</span></label>
                    <input type="range" id="inp-speed" min="1" max="100" value="95">
                </div>

                <hr class="divider">

                <div class="section tool-box">
                    <label>Pre-Draw Custom Path</label>
                    <div class="btn-group">
                        <button id="btn-tool-pencil" class="btn-tool" title="Draw Path">✏️ Draw</button>
                        <button id="btn-tool-eraser" class="btn-tool" title="Erase Path">❌ Erase</button>
                        <button id="btn-tool-clear" class="btn-tool" title="Clear Path">🗑️ Clear</button>
                    </div>
                    <p class="description warning hidden" id="path-warning">
                        Drawing a path disables incompatible algorithms (Eller's, Division, etc).
                    </p>
                </div>

                <hr class="divider">

                <div class="section">
                    <label for="inp-loops">Erase Walls (Create Loops)</label>
                    <input type="range" id="inp-loops" min="0" max="50" value="0">
                    <p class="description">Erases: <span id="lbl-loops">0%</span> of internal walls.</p>
                </div>

                <hr class="divider">

                <div class="section">
                    <label>Solution & Export Options</label>
                    
                    <div class="checkbox-row" style="margin: 10px 0;">
                        <input type="checkbox" id="chk-solve"> 
                        <label for="chk-solve" style="cursor:pointer; color: var(--primary);">
                            Solve Maze (Drag 🐒 & 🍌)
                        </label>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="sel-join">Solution Line Corners</label>
                            <select id="sel-join">
                                <option value="miter">Sharp (Miter)</option>
                                <option value="round" selected>Round</option>
                                <option value="bevel">Cut (Bevel)</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group" style="margin-top: 10px;">
                        <button id="btn-exp-svg">Download Vector (SVG)</button>
                        <button id="btn-exp-png">Download Bitmap (PNG)</button>
                    </div>
                </div>

            </details>
        </aside>

        <main class="viewport" id="viewport">
            <canvas id="canvas"></canvas>
            <div id="toast-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
